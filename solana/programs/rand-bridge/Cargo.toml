[package]
name = "rand-bridge"
version = "0.1.0"
edition = "2021"
description = "Rand bridge program for Solana: guardian-attested lock/release of SPL tokens"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

# `entrypoint!` expands to cfgs for the SBF target and for the optional
# custom heap/panic hooks, none of which this crate defines. Declaring them
# keeps a native `cargo build` warning-free.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }

[dependencies]
bincode = "1"
bridge-codec = { path = "../../../../fullnode/crates/bridge-codec" }
borsh = "1"
# `UpgradeableLoaderState`, to read the program's upgrade authority out
# of its ProgramData account. `solana_program::bpf_loader_upgradeable`
# re-exports this but is deprecated as of 2.3.
solana-loader-v3-interface = { version = "5", features = ["serde"] }
solana-program = "2"
# `solana-program` 2.3 deprecates its own re-exports of the system
# program id and instruction builders in favour of these two crates.
solana-sdk-ids = "2"
solana-system-interface = { version = "1", features = ["bincode"] }
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6", features = ["no-entrypoint"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"
# Signing test attestations with the shared vectors' guardian secrets;
# `sign_digest` in the integration test mirrors `randprotocol-core`'s, rather
# than depending on the fullnode workspace from here.
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
sha3 = "0.10"
solana-program-test = "2"
solana-sdk = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
