[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Explicit and complete: the remappings are part of every contract's metadata, hence of its
# runtime code hash, and GovernancePins pins the TimelockController's. Auto-detection would
# let any new directory under lib/ change that hash.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
# `script/Governance.s.sol` writes Safe Transaction Builder batches to
# ../deploy/governance; the tests write theirs under ./cache (git-ignored).
fs_permissions = [
    { access = "read", path = "../vectors" },
    { access = "read-write", path = "../deploy/governance" },
    { access = "read-write", path = "./cache/governance-test" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.fork]
evm_version = "cancun"
