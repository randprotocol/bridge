[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
# `script/Governance.s.sol` writes Safe Transaction Builder batches to
# ../deploy/governance; the tests write theirs under ./cache (git-ignored).
fs_permissions = [
    { access = "read", path = "../vectors" },
    { access = "read-write", path = "../deploy/governance" },
    { access = "read-write", path = "./cache/governance-test" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.fork]
evm_version = "cancun"
