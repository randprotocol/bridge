# Mainnet guardian 2 (index 1 in set 1). The key is read from ${GUARDIAN2_PRIV_KEY}.
data_dir = "./data/mainnet/guardian-2"
poll_secs = 15

[rand]
rpc = "http://127.0.0.1:8545"        # the bridged Rand chain's node, once it is cut
chain_id = 21                         # part of every PQ co-signature and governance message (spec/PQ-COSIGNATURE.md §9)
emitter = "c02df6ba70c2457a7406780da97492a6acb57dc40751e6279f003a570559d15f"

[[evm]]
name = "ethereum"
chain = 2
kind = "evm"
rpc = "https://ethereum-rpc.publicnode.com"
contract = "0x7aF6b17047C1db6cB54347FdEa45cF9179075bfA"
finality = "finalized"
start_block = 26090266          # the 2026-09-30 endpoint (deploy block); cursors start at sequence 1, past the consume-step lock

[[evm]]
name = "bsc"
chain = 3
kind = "evm"
rpc = "https://bsc-rpc.publicnode.com"
contract = "0x7aF6b17047C1db6cB54347FdEa45cF9179075bfA"
finality = 15
start_block = 125030322         # the 2026-09-30 endpoint (deploy block, 1 h before the cut); cursors start at sequence 1
max_log_range = 1000

[[evm]]
name = "tron"
chain = 4
kind = "tron"
rpc = "https://tron-rpc.publicnode.com"   # TronGrid rate-limits one IP without an API key
contract = "0x6410797df959987a5baf65b5fab97edeb34d5163"   # TK6JJv55CCkFjNHq7WwoU91GKaZEiC93me
finality = 19
start_block = 86699346          # the 2026-09-30 endpoint (deploy block); cursors start at sequence 1
max_log_range = 1000

[solana]
rpc = "https://api.mainnet-beta.solana.com"
program = "FGA3kY3RjfDKjUszJESMYtYXAbsnkFhhoxM3Mb34vycu"

[guardian]
listen = "127.0.0.1:7072"
key_env = "GUARDIAN2_PRIV_KEY"
pq_seed_env = "GUARDIAN2_PQ_SEED"

# BRG-1: the published caps (100 per transfer, 1,000 per day, every token), in attested 8-decimal
# units, held by this guardian before it signs. A transfer over per_transfer is withheld until
# `rand-guardian --release-held <chain>:<sequence>`; one over the day's window waits for room.
[guardian.limits]
per_transfer = 10000000000      # 100 tokens
per_window = 100000000000       # 1,000 tokens
window_secs = 86400
