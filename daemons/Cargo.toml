[package]
name = "rand-bridge-daemons"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The off-chain half of the Rand bridge: the guardian daemon (watch, check, sign) and the relayer daemon (collect a quorum, submit)"

[lib]
name = "bridge_daemons"
path = "src/lib.rs"

[[bin]]
name = "rand-guardian"
path = "src/bin/guardian.rs"

[[bin]]
name = "rand-relayer"
path = "src/bin/relayer.rs"

[[bin]]
name = "rand-bridge-audit"
path = "src/bin/audit.rs"

[dependencies]
bridge-codec = { path = "../../fullnode/crates/bridge-codec" }
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
bs58 = "0.5"
base64 = "0.22"
crystals-dilithium = "2.0"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rlp = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
curve25519-dalek = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "signal", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
